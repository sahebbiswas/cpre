name: Publish to PyPI / TestPyPI

# Releases use PyPI Trusted Publishing (OIDC), so no API tokens are stored
# in the repository. One-time setup, on both pypi.org and test.pypi.org:
#   Project "cpre" -> Publishing -> add a GitHub trusted publisher
#     owner: sahebbiswas   repository: cpre
#     workflow: release.yml
#     environment: pypi on pypi.org; none (any) on test.pypi.org
# The TestPyPI publisher names no environment, so it accepts the "testpypi"
# environment the job below runs in. GitHub creates the "pypi" and "testpypi"
# environments on first use; add required reviewers on "pypi" under
# Settings -> Environments if wanted.
#
# Flow (see CONTRIBUTING.md, "Releasing"):
#   * Manual run (workflow_dispatch): build, check, test the built
#     distributions, then publish to TestPyPI only.
#   * GitHub release published (tag vX.Y.Z): the same checks, publish to
#     TestPyPI, verify the TestPyPI install, then publish to PyPI. This is
#     the only way to reach production PyPI.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Read package version
        id: meta
        run: |
          version=$(python - <<'PY'
          import email.parser, glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              print(email.parser.Parser().parsestr(z.read(name).decode())["Version"])
          PY
          )
          echo "Package version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$VERSION'; expected 'v$VERSION'"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Test ${{ matrix.artifact }} (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
        python-version: ["3.9", "3.14"]
    steps:
      - name: Checkout code (tests and fixtures only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install into a clean virtual environment
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$ARTIFACT" = wheel ]; then
            pkg=$(ls dist/*.whl)
          else
            pkg=$(ls dist/*.tar.gz)
          fi
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "${pkg}[dev]"

      - name: Exercise the installed package and CLI
        # Run outside the checkout so nothing is imported from the source tree.
        working-directory: ${{ runner.temp }}
        env:
          SRC: ${{ github.workspace }}
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          cpre --help
          python -m cpre --help
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          import cpre

          assert "site-packages" in cpre.__file__, cpre.__file__
          fixture = Path(os.environ["SRC"]) / "tests/compatibility/fixtures/nested_conditionals.c"
          a = cpre.Variable("A")
          assert cpre.normalize(cpre.conjunction(a, a)) == a
          assert cpre.disjunction(a, cpre.negate(a)) == cpre.TRUE
          result = cpre.analyze_source(fixture.read_text(encoding="utf-8"), filename=fixture.name)
          assert result.complete, result
          out = subprocess.run(["cpre", "--sarif", str(fixture)], capture_output=True, text=True)
          assert out.returncode == 0, out.stderr
          driver = json.loads(out.stdout)["runs"][0]["tool"]["driver"]
          assert driver["semanticVersion"] == cpre.__version__, driver
          print("cpre", cpre.__version__, "OK")
          PY

      - name: Run the test suite against the installed package
        # The venv's pytest script (not python -m pytest) keeps the checkout
        # off sys.path; CPRE_REQUIRE_INSTALLED makes tests/conftest.py fail if
        # cpre would still be imported from the source tree.
        env:
          CPRE_REQUIRE_INSTALLED: "1"
        run: '"$RUNNER_TEMP/venv/bin/pytest" -p no:cacheprovider tests'

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cpre/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI never allows re-uploading a version. Manual dry runs may
          # repeat one, but a release must upload the files it just built, so
          # that the install check below tests exactly what goes to PyPI.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  verify-testpypi:
    name: Verify TestPyPI install
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          # The new upload can take a moment to appear in the index.
          for attempt in 1 2 3 4 5 6; do
            if "$RUNNER_TEMP/venv/bin/python" -m pip install --no-cache-dir \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "cpre==$VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          "$RUNNER_TEMP/venv/bin/cpre" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" -c "import cpre, sys; print(cpre.__version__); sys.exit(cpre.__version__ != '$VERSION')"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke-test, verify-testpypi]
    # Only a published release reaches production PyPI, and only after the
    # TestPyPI upload and install check have succeeded.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cpre/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
