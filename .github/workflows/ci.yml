name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version-bump:
    # Every pull request bumps __version__ in cpre/__init__.py by one SemVer
    # step (CONTRIBUTING.md, "Versioning"). The checkout is GitHub's test
    # merge commit, whose first parent is the tip of the base branch, so
    # depth 2 brings the base version along with no extra fetch.
    name: Version bumped
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compare with the base branch
        run: |
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "::error::Expected the pull request's test merge commit, found a single-parent commit"
            exit 1
          fi
          git show HEAD^1:cpre/__init__.py > "$RUNNER_TEMP/base_version.py"
          python3 .github/scripts/check_version_bump.py "$RUNNER_TEMP/base_version.py" cpre/__init__.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  lint:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install tox tox-uv
      - name: Run Lint & Mypy
        run: tox run -e lint,mypy

  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Validate installed wheel public API contract
        run: |
          python -m pip install --force-reinstall dist/*.whl pytest
          mkdir -p /tmp/cpre-contract/compatibility
          cp tests/test_downstream_contract.py /tmp/cpre-contract/
          cp tests/test_structural_downstream_contract.py /tmp/cpre-contract/
          cp tests/test_cgull_symbolic_migration_profile.py /tmp/cpre-contract/
          cp tests/compatibility/cgull-symbolic-profile.json /tmp/cpre-contract/compatibility/
          cd /tmp/cpre-contract
          python -m pytest -q \
            test_downstream_contract.py \
            test_structural_downstream_contract.py \
            test_cgull_symbolic_migration_profile.py
          python -m cpre --help
