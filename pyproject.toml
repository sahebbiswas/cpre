[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpre"
dynamic = ["version"]
description = "Analyze and simplify C/C++ preprocessor conditional logic"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Saheb Biswas"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sahebbiswas/cpre"
Documentation = "https://github.com/sahebbiswas/cpre/blob/main/docs/README.md"
Repository = "https://github.com/sahebbiswas/cpre"
Issues = "https://github.com/sahebbiswas/cpre/issues"

[project.scripts]
cpre = "cpre.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "hypothesis>=6",
  "pycparser>=2.22",
  "pcpp>=1.30,<2",
  "build>=1",
  "twine>=5",
  "ruff>=0.1",
  "mypy>=1.0",
  "pre-commit>=3.0",
  "tox>=4.0",
  "tox-uv>=1.0",
]

[tool.setuptools.dynamic]
version = {attr = "cpre.__version__"}

[tool.setuptools.packages.find]
include = ["cpre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["F401", "E501", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cpre.cli",
    "cpre.expansion",
    "cpre.numeric_conditions",
    "cpre.pragmas",
    "cpre.preprocessing",
    "cpre.reporting",
    "cpre.symbolic",
]
ignore_errors = true
ignore_missing_imports = true
